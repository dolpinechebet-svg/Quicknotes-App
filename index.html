<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Write it down. Find it fast.</p>
  </header>

  <main>
    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note:</label>
        <input type="text" id="note-input" name="note" placeholder="Type your note here">
        <select id="note-category" name="category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section>
      <h2>Your notes</h2>
      <input type="search" id="search-input" placeholder="Search notes..." aria-label="Search notes">
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. All rights reserved.</p>
  </footer>
</body>
</html>
